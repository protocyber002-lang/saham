<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClickTycoon Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { background-color: #1e1e1e; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 10px; background: #111; text-align: center; border-bottom: 1px solid #333; }
        .header h2 { color: #00bfff; font-size: 1.2em; }
        #chartContainer { flex: 0 0 35vh; background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; display: none; position: relative; }
        #chartTitle { color:#00bfff; text-align:center; font-size: 1em; margin-bottom: 5px; }
        #chartCanvas { width: 100% !important; height: calc(35vh - 40px) !important; }
        #stockList { flex: 1 1 auto; overflow-y: auto; padding: 15px; }
        .card { background-color: #2a2a2a; padding: 15px; margin-bottom: 12px; border-radius: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; cursor: pointer; }
        .stock-info { flex: 1 1 200px; }
        .stock-info strong { color: #00bfff; font-size: 1.1em; }
        .stock-info .price { font-size: 1.2em; color: #fff; font-weight: bold; }
        .stock-info .name { font-size: 0.85em; color: #aaa; }
        .controls { display: flex; gap: 8px; }
        .btn-del { background: #dc3545 !important; color: #fff !important; padding: 6px 8px; font-size: 0.8em; }
        button { padding: 10px 15px; border: none; border-radius: 5px; background: #00bfff; color: #000; font-weight: bold; cursor: pointer; }
        button:active { background: #0099cc; }
        #loginScreen { display: none; padding: 20px; max-width: 400px; margin: 0 auto; flex-direction: column; justify-content: center; height: 100vh; }
        input, select { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #444; border-radius: 5px; background: #2a2a2a; color: #fff; font-size: 1em; }
        .hidden { display: none !important; }
        .block { display: block !important; }
        .flex { display: flex !important; }
    </style>
</head>
<body>
    <div id="userStatusPanel" style="position: fixed; top: 15px; left: 15px; z-index: 99999; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; border: 1px solid #444; display: none; gap: 10px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
        <span id="userProfileText" style="color: #00ff00; font-weight: bold; font-family: sans-serif;"></span>
        <button id="btnLogoutGlobal" onclick="doLogout()" style="background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Logout</button>
    </div>

    <div id="loginScreen">
        <h2 style="color:#00bfff; text-align:center; margin-bottom:5px;">ClickTycoon</h2>
        <p style="color:#888; text-align:center; margin-bottom:25px; font-size:0.9em;">Masuk untuk melihat pasar saham</p>
        <div id="pairSection">
            <input type="text" id="code" placeholder="Kode Pairing (6 digit)" inputmode="numeric">
            <p style="color:#666; font-size:0.8em; margin:-5px 0 10px;">Kode pairing tampil di jendela Server (Core\Server.ps1)</p>
        </div>
        <input type="text" id="profName" placeholder="Nama Profil (misal: ayah1)">
        <button id="btnLogin" onclick="doLogin()" style="width:100%; padding:15px;">Masuk</button>
        <p id="loginMsg" style="color:#ff6b6b; text-align:center; margin-top:15px; font-size:0.9em; min-height:1.2em;"></p>
    </div>

    <div id="app" class="hidden">
        <div class="header"><h2>Pasar Saham</h2></div>
        <div id="chartContainer">
            <h3 id="chartTitle">Pilih Saham</h3>
            <canvas id="chartCanvas"></canvas>
        </div>
        <div id="stockList"></div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api/';
        let myChart = null;

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        function safeTicker(t) {
            return String(t || '').replace(/[^A-Za-z0-9._-]/g, '');
        }

        function checkAuth() {
            const token = localStorage.getItem('ct_token');
            const profile = localStorage.getItem('ct_profile');

            if (token && profile) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('flex');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('flex');
                document.getElementById('userProfileText').textContent = 'Login: ' + profile;
                document.getElementById('userStatusPanel').style.display = 'flex';
                loadStocks();
                if (!window._stocksTimer) { window._stocksTimer = setInterval(loadStocks, 3000); }
            } else {
                document.getElementById('app').classList.add('hidden');
                document.getElementById('app').classList.remove('flex');
                document.getElementById('userStatusPanel').style.display = 'none';
                document.getElementById('pairSection').style.display = token ? 'none' : 'block';
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('loginScreen').classList.add('flex');
            }
        }

        async function doLogin() {
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('btnLogin');
            const prof = document.getElementById('profName').value.trim();
            msg.textContent = '';
            if (!prof) { msg.textContent = 'Nama profil tidak boleh kosong'; return; }
            btn.disabled = true; btn.textContent = 'Memproses...';
            function reset() { btn.disabled = false; btn.textContent = 'Masuk'; }
            try {
                let token = localStorage.getItem('ct_token');
                if (!token) {
                    const code = document.getElementById('code').value.trim();
                    if (!code) { msg.textContent = 'Masukkan kode pairing dari jendela Server'; reset(); return; }
                    const resPair = await fetch(API_BASE + 'pair', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: code, name: 'WebBrowser' })
                    });
                    const dataPair = await resPair.json();
                    if (dataPair.status !== 'ok') { msg.textContent = 'Pairing gagal: ' + (dataPair.message || 'kode salah'); reset(); return; }
                    token = dataPair.token;
                    localStorage.setItem('ct_token', token);
                    document.getElementById('pairSection').style.display = 'none';
                }
                const resLogin = await fetch(API_BASE + 'login_profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ profile: prof })
                });
                const dataLogin = await resLogin.json();
                if (dataLogin.status === 'ok') {
                    localStorage.setItem('ct_profile', dataLogin.profile);
                    localStorage.setItem('ct_logged_in', 'true');
                    checkAuth();
                } else {
                    msg.textContent = 'Login gagal: ' + (dataLogin.message || 'profil tidak ditemukan');
                    reset();
                }
            } catch (e) { msg.textContent = 'Gagal terhubung ke server.'; reset(); }
        }

        async function doLogout() {
            if (!confirm('Yakin ingin logout?')) return;
            const token = localStorage.getItem('ct_token');
            if (token) { try { await fetch(API_BASE + 'logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch (e) {} }
            localStorage.removeItem('ct_token');
            localStorage.removeItem('ct_profile');
            localStorage.removeItem('ct_logged_in');
            window.location.reload();
        }

        async function loadStocks() {
            const token = localStorage.getItem('ct_token');
            if (!token) return;
            try {
                const res = await fetch(API_BASE + 'stocks', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401 || res.status === 403) { localStorage.removeItem('ct_token'); localStorage.removeItem('ct_profile'); localStorage.removeItem('ct_logged_in'); checkAuth(); return; }
                const stocks = await res.json();
                const container = document.getElementById('stockList');
                container.innerHTML = '';
                stocks.forEach(s => {
                    const t = safeTicker(s.Ticker);
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <div class="stock-info">
                            <strong>${esc(t)}</strong><br>
                            <span class="name">${esc(s.Name)}</span><br>
                            <span class="price">Rp ${Number(s.Price || 0).toFixed(2)}</span>
                        </div>
                        <div class="controls">
                            <button onclick="event.stopPropagation(); buy('${t}', 1)">Beli 1</button>
                            <button onclick="event.stopPropagation(); buy('${t}', 10)">Beli 10</button>
                            <button class="btn-del" onclick="event.stopPropagation(); voteDelete('${t}')">Minta Hapus</button>
                        </div>
                    `;
                    div.onclick = () => loadChart(t, s.Name);
                    container.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        function pollBuyStatus(orderId) {
            return new Promise(resolve => {
                const token = localStorage.getItem('ct_token');
                let tries = 0;
                async function tick() {
                    tries++;
                    try {
                        const res = await fetch(API_BASE + 'buy_status?orderId=' + encodeURIComponent(orderId), {
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        const d = await res.json();
                        if (d.status && d.status !== 'pending') { resolve(d); return; }
                    } catch (e) {}
                    if (tries >= 20) { resolve({ status: 'timeout' }); return; }
                    setTimeout(tick, 1000);
                }
                tick();
            });
        }

        async function buy(ticker, qty) {
            const token = localStorage.getItem('ct_token');
            if (!token) { alert('Login dulu sebelum beli.'); return; }
            try {
                const res = await fetch(API_BASE + 'buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ ticker: ticker, qty: qty })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    alert('Perintah beli dikirim. Menunggu tercatat di dashboard...');
                    const st = await pollBuyStatus(data.orderId);
                    if (st.status === 'Executed') { alert('Aksi beli tercatat di DashboardGUI ✔ (' + qty + ' ' + ticker + ')'); }
                    else if (st.status === 'Held') { alert('Order ditahan: ' + (st.message || 'uang belum cukup') + '. Otomatis dieksekusi saat uang cukup.'); }
                    else if (st.status === 'Failed') { alert('Aksi beli gagal diproses di dashboard: ' + (st.message || 'tidak valid')); }
                    else { alert('Belum ada konfirmasi dari dashboard (GUI/TUI untuk profil ini mungkin tidak terbuka, atau masih ada proses lama berjalan). Order tetap menunggu di antrian.'); }
                }
                else { alert('Gagal: ' + data.message); }
                loadStocks();
            } catch (e) { alert('Gagal terhubung.'); }
        }

        async function voteDelete(ticker) {
            const token = localStorage.getItem('ct_token');
            if (!token) { alert('Login dulu.'); return; }
            if (!confirm('Minta hapus saham ' + ticker + '? Saham dihapus jika disetujui 51% semua profil.')) return;
            try {
                const res = await fetch(API_BASE + 'stock_vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ ticker: ticker })
                });
                const data = await res.json();
                if (data.status === 'ok') { alert('Permintaan hapus dicatat: ' + data.votes + '/' + data.threshold + ' profil (total profil ' + data.total + '). Saham dihapus otomatis saat mencapai 51%.'); }
                else if (data.status === 'already') { alert('Anda sudah meminta hapus ' + ticker + ': ' + data.votes + '/' + data.threshold + ' profil.'); }
                else { alert('Gagal: ' + (data.message || 'tidak diketahui')); }
            } catch (e) { alert('Gagal terhubung.'); }
        }

        async function loadChart(ticker, name) {
            const token = localStorage.getItem('ct_token');
            document.getElementById('chartContainer').style.display = 'block';
            document.getElementById('chartTitle').innerText = ticker + ' - ' + name;
            try {
                const res = await fetch(API_BASE + 'history?ticker=' + ticker, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                let hist = data.history;
                if (hist.length > 30) { hist = hist.slice(hist.length - 30); }
                const prices = hist.map(h => h.Price || h);
                const labels = hist.map((h, i) => i);
                if (myChart) { myChart.destroy(); }
                const ctx = document.getElementById('chartCanvas').getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: ticker, data: prices, borderColor: '#00bfff', backgroundColor: 'rgba(0,191,255,0.1)', borderWidth: 2, fill: true, pointRadius: 0, tension: 0.2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#333' }, ticks: { color: '#aaa' } } } }
                });
            } catch (e) { console.error(e); }
        }

        checkAuth();
    </script>

<script>
/* PATCH V11: PENANGKAP ERROR 429 (COOLDOWN) */
document.addEventListener('DOMContentLoaded', () => {
    // Kita bungkus fungsi fetch untuk menangkap respon 429 dari /api/buy
    const originalFetch = window.fetch;
    window.fetch = async function() {
        let [resource, config] = arguments;
        let response = await originalFetch.apply(this, arguments);
        
        // Jika endpoint adalah /api/buy dan statusnya 429
        if (typeof resource === 'string' && resource.includes('/api/buy') && response.status === 429) {
            try {
                // Clone response agar bisa dibaca tanpa merusak response asli
                const clonedRes = response.clone();
                const data = await clonedRes.json();
                alert("⚠️ " + data.message); // Tampilkan pesan "Tunggu X detik lagi"
            } catch(e) {
                alert("Tunggu sebentar sebelum membeli lagi.");
            }
        }
        return response;
    };
});
</script>
<script>
/* PATCH V12: PROTEKSI DATA KOSONG */
document.addEventListener('DOMContentLoaded', () => {
    // Timpa fungsi fetch untuk mencegah error undefined length
    const originalFetch = window.fetch;
    window.fetch = async function() {
        let [resource, config] = arguments;
        let response = await originalFetch.apply(this, arguments);
        
        if (typeof resource === 'string' && resource.includes('/api/history')) {
            let cloned = response.clone();
            try {
                let data = await cloned.json();
                if (!data.history || !Array.isArray(data.history)) {
                    // Jika history kosong, buat data dummy agar chart tidak crash
                    return new Response(JSON.stringify({ ticker: data.ticker, history: [{price: 100}, {price: 101}] }), {
                        status: 200, headers: { 'Content-Type': 'application/json' }
                    });
                }
            } catch(e) {}
        }
        return response;
    };
});
</script>
