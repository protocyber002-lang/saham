<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClickTycoon Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body { background-color: #1e1e1e; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 10px; background: #111; text-align: center; border-bottom: 1px solid #333; }
        .header h2 { color: #00bfff; font-size: 1.2em; }
        #chartContainer { flex: 0 0 35vh; background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; display: none; position: relative; }
        #chartTitle { color:#00bfff; text-align:center; font-size: 1em; margin-bottom: 5px; }
        #chartCanvas { width: 100% !important; height: calc(35vh - 40px) !important; }
        #stockList { flex: 1 1 auto; overflow-y: auto; padding: 15px; }
        .card { background-color: #2a2a2a; padding: 15px; margin-bottom: 12px; border-radius: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; cursor: pointer; }
        .stock-info { flex: 1 1 200px; }
        .stock-info strong { color: #00bfff; font-size: 1.1em; }
        .stock-info .price { font-size: 1.2em; color: #fff; font-weight: bold; }
        .stock-info .name { font-size: 0.85em; color: #aaa; }
        .controls { display: flex; gap: 8px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; background: #00bfff; color: #000; font-weight: bold; cursor: pointer; }
        button:active { background: #0099cc; }
        #loginScreen, #profileScreen { display: none; padding: 20px; max-width: 400px; margin: 0 auto; flex-direction: column; justify-content: center; height: 100vh; }
        input, select { padding: 12px; width: 100%; margin-bottom: 10px; border: 1px solid #444; border-radius: 5px; background: #2a2a2a; color: #fff; font-size: 1em; }
        .hidden { display: none !important; }
        .block { display: block !important; }
        .flex { display: flex !important; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <h2 style="color:#00bfff; text-align:center; margin-bottom:20px;">Pairing Perangkat</h2>
        <input type="text" id="code" placeholder="Kode Pairing (6 digit)" inputmode="numeric">
        <input type="text" id="devname" placeholder="Nama Perangkat (misal: HP Samsung)">
        <button onclick="doPair()" style="width:100%; padding:15px;">Hubungkan</button>
    </div>

    <div id="profileScreen">
        <h2 style="color:#00bfff; text-align:center; margin-bottom:20px;">Pilih Profil</h2>
        <input type="text" id="profName" placeholder="Masukkan Nama Profil (misal: ayah1)">
        <button onclick="doLoginProfile()" style="width:100%; padding:15px;">Masuk</button>
    </div>

    <div id="app" class="hidden">
        <div class="header"><h2>Pasar Saham</h2></div>
        <div id="chartContainer">
            <h3 id="chartTitle">Pilih Saham</h3>
            <canvas id="chartCanvas"></canvas>
        </div>
        <div id="stockList"></div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api/';
        let myChart = null;

        function checkAuth() {
            const token = localStorage.getItem('token');
            const profile = localStorage.getItem('profile');
            
            if (!token) {
                document.getElementById('loginScreen').classList.add('flex');
                document.getElementById('profileScreen').classList.add('hidden');
                document.getElementById('app').classList.add('hidden');
            } else if (!profile) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('profileScreen').classList.add('flex');
                document.getElementById('app').classList.add('hidden');
            } else {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('profileScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('flex');
                loadStocks();
                setInterval(loadStocks, 3000);
            }
        }

        async function doPair() {
            const code = document.getElementById('code').value.trim();
            const name = document.getElementById('devname').value.trim() || 'HP';
            try {
                const res = await fetch(API_BASE + 'pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, name: name })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    localStorage.setItem('token', data.token);
                    checkAuth();
                } else { alert('Kode Pairing Salah!'); }
            } catch (e) { alert('Gagal terhubung.'); }
        }

        async function doLoginProfile() {
            const prof = document.getElementById('profName').value.trim();
            if (!prof) { alert('Nama profil tidak boleh kosong'); return; }
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(API_BASE + 'login_profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ profile: prof })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    localStorage.setItem('profile', data.profile);
                    checkAuth();
                } else { alert('Profil tidak ditemukan!'); }
            } catch (e) { alert('Gagal login profil.'); }
        }

        async function loadStocks() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch(API_BASE + 'stocks', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.status === 401) { localStorage.removeItem('token'); checkAuth(); return; }
                const stocks = await res.json();
                const container = document.getElementById('stockList');
                container.innerHTML = '';
                stocks.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <div class="stock-info">
                            <strong>${s.Ticker}</strong><br>
                            <span class="name">${s.Name}</span><br>
                            <span class="price">Rp ${s.Price.toFixed(2)}</span>
                        </div>
                        <div class="controls">
                            <button onclick="event.stopPropagation(); buy('${s.Ticker}', 1)">Beli 1</button>
                            <button onclick="event.stopPropagation(); buy('${s.Ticker}', 10)">Beli 10</button>
                        </div>
                    `;
                    div.onclick = () => loadChart(s.Ticker, s.Name);
                    container.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        async function buy(ticker, qty) {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch(API_BASE + 'buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ ticker: ticker, qty: qty })
                });
                const data = await res.json();
                if (data.status === 'ok') { alert('Berhasil beli ' + qty + ' ' + ticker); }
                else { alert('Gagal: ' + data.message); }
                loadStocks();
            } catch (e) { alert('Gagal terhubung.'); }
        }

        async function loadChart(ticker, name) {
            const token = localStorage.getItem('token');
            document.getElementById('chartContainer').style.display = 'block';
            document.getElementById('chartTitle').innerText = ticker + ' - ' + name;
            try {
                const res = await fetch(API_BASE + 'history?ticker=' + ticker, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                let hist = data.history;
                if (hist.length > 30) { hist = hist.slice(hist.length - 30); }
                const prices = hist.map(h => h.Price || h);
                const labels = hist.map((h, i) => i);
                if (myChart) { myChart.destroy(); }
                const ctx = document.getElementById('chartCanvas').getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: ticker, data: prices, borderColor: '#00bfff', backgroundColor: 'rgba(0,191,255,0.1)', borderWidth: 2, fill: true, pointRadius: 0, tension: 0.2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#333' }, ticks: { color: '#aaa' } } } }
                });
            } catch (e) { console.error(e); }
        }

        checkAuth();
    </script>

<div id="userStatusPanel" style="position: fixed; top: 15px; left: 15px; z-index: 99999; background: rgba(0,0,0,0.9); padding: 10px; border-radius: 8px; border: 1px solid #444; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    <span id="userProfileText" style="color: #aaa; font-weight: bold; font-family: sans-serif;">Guest (Belum Login)</span>
    <button id="btnOpenLogin" style="background-color: #00aaff; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Login</button>
    <button id="btnLogoutGlobal" style="display: none; background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Logout</button>
</div>

<!-- MODAL POP-UP LOGIN -->
<div id="loginModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999999; justify-content: center; align-items: center;">
    <div style="background: #222; padding: 30px; border-radius: 10px; border: 1px solid #00aaff; text-align: center; width: 80%; max-width: 300px;">
        <h2 style="color: #00aaff; margin-top: 0;">Login Profil</h2>
        <input type="text" id="modalProfileInput" placeholder="Nama profil (contoh: ayah1)" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #555; background: #111; color: white; box-sizing: border-box;">
        <button id="btnSubmitLogin" style="width: 100%; padding: 10px; background: #00aaff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">Masuk</button>
        <button id="btnCloseLogin" style="width: 100%; padding: 10px; background: #555; color: white; border: none; border-radius: 5px; cursor: pointer;">Batal</button>
    </div>
</div>

<script>
/* PATCH V10: SISTEM LOGIN TERPUSAT & PROTEKSI UI */
document.addEventListener('DOMContentLoaded', () => {
    const isLoggedIn = localStorage.getItem('ct_logged_in') === 'true';
    const profileName = localStorage.getItem('ct_profile') || 'Player';
    
    const panelText = document.getElementById('userProfileText');
    const btnOpenLogin = document.getElementById('btnOpenLogin');
    const btnLogout = document.getElementById('btnLogoutGlobal');
    const modal = document.getElementById('loginModal');
    const inputModal = document.getElementById('modalProfileInput');

    // ==========================================
    // JIKA SUDAH LOGIN
    // ==========================================
    if (isLoggedIn) {
        panelText.innerHTML = "Login: <span style='color: #00ff00;'>" + profileName + "</span>";
        btnOpenLogin.style.display = 'none';
        btnLogout.style.display = 'block';
        
        btnLogout.addEventListener('click', async () => {
            if (!confirm("Yakin ingin logout?")) return;
            btnLogout.innerText = "...";
            const token = localStorage.getItem('ct_token');
            if (token) { try { await fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e) {} }
            localStorage.removeItem('ct_logged_in'); localStorage.removeItem('ct_profile'); localStorage.removeItem('ct_token');
            window.location.reload();
        });
    } 
    // ==========================================
    // JIKA BELUM LOGIN (GUEST) -> SEMBUNYIKAN TOMBOL BELI/JUAL
    // ==========================================
    else {
        // Trik Pembersihan: Tunggu 0.5 detik agar web selesai loading, lalu sapu bersih tombol Beli/Jual
        setTimeout(() => {
            // Metode 1: Cari berdasarkan teks (Beli, Jual, Buy, Sell)
            const allElements = document.querySelectorAll('button, div, a, span');
            allElements.forEach(el => {
                // Hanya periksa elemen yang tidak punya anak elemen (paling ujung)
                if (el.children.length === 0) {
                    const txt = el.innerText.toLowerCase().trim();
                    if (txt === 'beli 1' || txt === 'beli 10' || txt === 'jual' || txt.includes('beli') || txt.includes('jual')) {
                        el.style.display = 'none'; // Sembunyikan elemen
                        el.remove(); // Hapus dari halaman
                    }
                }
            });
        }, 500);

        // Tampilkan Modal saat tombol Login diklik
        btnOpenLogin.addEventListener('click', () => {
            modal.style.display = 'flex';
            inputModal.focus();
        });

        document.getElementById('btnCloseLogin').addEventListener('click', () => {
            modal.style.display = 'none';
        });
    }

    // ==========================================
    // LOGIKA PROSES LOGIN (DARI MODAL)
    // ==========================================
    document.getElementById('btnSubmitLogin').addEventListener('click', async function() {
        const profName = inputModal.value.trim();
        if (!profName) { alert("Masukkan nama profil!"); return; }

        this.innerText = "Memproses...";
        this.disabled = true;

        let token = localStorage.getItem('ct_token');
        
        // Jika belum punya token, minta Pairing Code
        if (!token) {
            const code = prompt("Masukkan 6 Digit Pairing Code (Lihat di terminal Server):");
            if (!code) { this.innerText = "Masuk"; this.disabled = false; return; }
            
            try {
                const resPair = await fetch('/api/pair', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, name: "WebBrowser" })
                });
                const dataPair = await resPair.json();
                if (dataPair.status === 'ok') { 
                    token = dataPair.token; 
                    localStorage.setItem('ct_token', token); 
                } else { 
                    alert("Pairing Gagal: " + dataPair.message); 
                    this.innerText = "Masuk"; this.disabled = false; return; 
                }
            } catch(e) { alert("Error Koneksi Server"); this.innerText = "Masuk"; this.disabled = false; return; }
        }

        // Proses Login
        try {
            const resLogin = await fetch('/api/login_profile', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ profile: profName })
            });
            const dataLogin = await resLogin.json();

            if (dataLogin.status === 'ok') {
                localStorage.setItem('ct_logged_in', 'true');
                localStorage.setItem('ct_profile', dataLogin.profile);
                window.location.reload(); 
            } else {
                alert("Gagal Login: " + dataLogin.message);
                this.innerText = "Masuk"; this.disabled = false;
            }
        } catch(e) { alert("Error Koneksi"); this.innerText = "Masuk"; this.disabled = false; }
    });
});
</script>
<script>
/* PATCH V11: PENANGKAP ERROR 429 (COOLDOWN) */
document.addEventListener('DOMContentLoaded', () => {
    // Kita bungkus fungsi fetch untuk menangkap respon 429 dari /api/buy
    const originalFetch = window.fetch;
    window.fetch = async function() {
        let [resource, config] = arguments;
        let response = await originalFetch.apply(this, arguments);
        
        // Jika endpoint adalah /api/buy dan statusnya 429
        if (typeof resource === 'string' && resource.includes('/api/buy') && response.status === 429) {
            try {
                // Clone response agar bisa dibaca tanpa merusak response asli
                const clonedRes = response.clone();
                const data = await clonedRes.json();
                alert("⚠️ " + data.message); // Tampilkan pesan "Tunggu X detik lagi"
            } catch(e) {
                alert("Tunggu sebentar sebelum membeli lagi.");
            }
        }
        return response;
    };
});
</script>
<script>
/* PATCH V12: PROTEKSI DATA KOSONG */
document.addEventListener('DOMContentLoaded', () => {
    // Timpa fungsi fetch untuk mencegah error undefined length
    const originalFetch = window.fetch;
    window.fetch = async function() {
        let [resource, config] = arguments;
        let response = await originalFetch.apply(this, arguments);
        
        if (typeof resource === 'string' && resource.includes('/api/history')) {
            let cloned = response.clone();
            try {
                let data = await cloned.json();
                if (!data.history || !Array.isArray(data.history)) {
                    // Jika history kosong, buat data dummy agar chart tidak crash
                    return new Response(JSON.stringify({ ticker: data.ticker, history: [{price: 100}, {price: 101}] }), {
                        status: 200, headers: { 'Content-Type': 'application/json' }
                    });
                }
            } catch(e) {}
        }
        return response;
    };
});
</script>
